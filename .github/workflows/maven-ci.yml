name: Maven CI - Selenium Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Run Selenium Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Compile project
        run: mvn clean compile

      - name: Run TestNG tests (headless Chrome)
        run: mvn test -Dheadless=true
        continue-on-error: true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: testng-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-jar
          path: target/*.jar
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish Test Summary
        if: always()
        run: |
          echo "## Maven CI Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -d target/surefire-reports ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Surefire Reports" >> $GITHUB_STEP_SUMMARY
            ls -la target/surefire-reports/ >> $GITHUB_STEP_SUMMARY
          fi
